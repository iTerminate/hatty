# hatty config: connection settings + display preferences only.
# Your lists, entity-name overrides, dashboards and saved graphs are stored in a
# SQLite database next to this file (hatty.db) — you don't edit them here.
# Tip: you can skip this file entirely and let the first-run setup wizard create it.
home_assistant:
  # Prefer an https:// URL: with http:// the long-lived token below is sent
  # unencrypted and anyone on the network path can capture it.
  url: "http://homeassistant.local:8123"
  token: "YOUR_LONG_LIVED_ACCESS_TOKEN"
columns: ["name", "value", "last_changed", "in_list"]
theme: null
graph_type: line
graph_hours: 4
log_hours: 24
# Custom keybindings, also editable from Configuration > Keybindings in the app.
# Maps a keybinding id to a Textual key string; omitted ids keep their default.
# keybindings:
#   log.toggle: "A"
#   nav.back: "backspace"
# Backup & Sync, also editable from Configuration > Backup & Sync in the app.
# Exports lists/dashboards/saved_graphs/entity_names/settings/keybindings as a
# directory of JSON files under "path" (never the token above or the ntfy
# password); optionally treats that directory as a git repo.
# backup:
#   path: "/home/you/hatty-backup"
#   sections: ["lists", "dashboards", "saved_graphs", "entity_names", "settings", "keybindings"]
#   git_enabled: true
#   pull_on_start: true
#   import_on_pull: true
#   commit_on_exit: true
#   push_on_exit: true
#   pull_rebase: false
