[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hatty"
version = "0.1.0"
description = "hatty — a TTY for your HA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "aiohttp>=3.9",
    "textual>=8.0",
    "textual-plotext>=0.2.1",
    "textual-colorpicker>=0.1.0",
    "textual-fspicker>=1.0.1",
]

[project.scripts]
hatty = "hatty.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.0",
    "ruff",
    "pyright",
    "pyinstaller",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hatty"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
include = ["src/hatty"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# #167 wired pyright to guard the tree-wide basics (missing imports, undefined
# names, redeclarations); #198 then re-enabled the deeper rule categories one at
# a time (reportOptionalMemberAccess, reportOptionalSubscript, reportAttribute-
# AccessIssue, reportIncompatibleMethodOverride, reportCallIssue, reportAssignment-
# Type, and finally reportArgumentType). Every basic-mode category is enabled now
# and #198 is complete — nothing is suppressed here.
